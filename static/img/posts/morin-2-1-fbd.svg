<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="Georgia, 'Times New Roman', serif" font-size="16">
  <title>Free-body diagram of a rope element dy</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <g color="#3b82f6"><line x1="150" y1="110" x2="150" y2="30" stroke="currentColor" stroke-width="2.5" marker-end="url(#a)"/></g>
  <text x="162" y="44" fill="#3b82f6" font-style="italic">T(y + dy)</text>
  <rect x="135" y="110" width="30" height="80" rx="4" fill="none" stroke="#8a919c" stroke-width="3"/>
  <line x1="170" y1="110" x2="200" y2="110" stroke="#8a919c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="170" y1="190" x2="200" y2="190" stroke="#8a919c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="206" y="155" fill="#8a919c" font-style="italic">dy</text>
  <g color="#3b82f6"><line x1="142" y1="190" x2="142" y2="270" stroke="currentColor" stroke-width="2.5" marker-end="url(#a)"/></g>
  <text x="60" y="262" fill="#3b82f6" font-style="italic">T(y)</text>
  <g color="#e0773b"><line x1="158" y1="150" x2="158" y2="250" stroke="currentColor" stroke-width="2.5" marker-end="url(#a)"/></g>
  <text x="170" y="250" fill="#e0773b" font-style="italic">ρ g dy</text>
</svg>
